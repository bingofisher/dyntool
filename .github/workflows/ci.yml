name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: "1"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  quality:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync dependencies
        run: uv sync --python 3.13 --group dev --group docs --group gui

      - name: Prepare temp directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .pytest_tmp | Out-Null

      - name: Codex assets
        run: uv run python -B scripts/check_codex_assets.py

      - name: Ruff check
        run: uv run ruff check --no-cache src/dyntool src/dyntool_gui tests examples scripts

      - name: Ruff format check
        run: uv run ruff format --check --no-cache src/dyntool src/dyntool_gui tests examples scripts

      - name: Layer imports
        run: uv run python -B scripts/check_layer_imports.py

      - name: Text quality
        run: uv run python -B scripts/check_text_quality.py

      - name: Docstring coverage
        run: uv run python -B scripts/check_docstring_coverage.py

      - name: Public API baseline
        run: uv run python -B scripts/check_public_api_baseline.py

      - name: Resource consistency
        run: uv run python -B scripts/check_resource_consistency.py

      - name: MkDocs site checks
        run: uv run python -B scripts/check_mkdocs_site.py

      - name: Repository governance
        run: uv run python -B scripts/check_repository_governance.py

      - name: Helper structure
        run: uv run python -B scripts/check_helper_structure.py

      - name: Pyright
        run: uv run pyright src/dyntool tests/typing_public_api.py

      - name: Build docs
        shell: pwsh
        run: uv run python -B -m mkdocs build --strict --site-dir .pytest_tmp/mkdocs-site

      - name: Pytest
        shell: pwsh
        run: uv run python -B -m pytest -q --basetemp .pytest_tmp/pytest -p no:cacheprovider

      - name: Clean generated artifacts
        run: uv run python -B scripts/clean_generated_artifacts.py --apply

  core-minimum:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up bootstrap Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv
      - name: Install minimum Python
        run: uv python install 3.12.12
      - name: Sync core validation dependencies
        run: uv sync --locked --python 3.12.12 --group dev
      - name: Prepare core temp directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force .pytest_tmp | Out-Null
      - name: Core regression
        run: uv run python -B -m pytest tests/test_core_architecture_contracts.py tests/test_core_numerical_contracts.py tests/test_core_storage_contracts.py tests/test_core_review_followup.py tests/test_mechanical_series.py -q --basetemp .pytest_tmp/core-minimum -p no:cacheprovider
      - name: Build wheel
        run: uv build --wheel --out-dir .pytest_tmp/wheels
      - name: Isolated wheel install
        shell: pwsh
        run: |
          uv venv .pytest_tmp/wheel-check --python 3.12.12
          $wheel = (Get-ChildItem .pytest_tmp/wheels/*.whl | Select-Object -First 1).FullName
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file .pytest_tmp/wheel-requirements.txt
          uv pip sync --python .pytest_tmp/wheel-check/Scripts/python.exe .pytest_tmp/wheel-requirements.txt
          uv pip install --no-deps --python .pytest_tmp/wheel-check/Scripts/python.exe $wheel
          Push-Location $env:TEMP
          try {
            & "$env:GITHUB_WORKSPACE/.pytest_tmp/wheel-check/Scripts/python.exe" -B -c "from dyntool import AccelSeries, DefaultSample, Metadata; a=AccelSeries.from_data([1,2,3],dt=.01); s=DefaultSample(metadata=Metadata(identity={'case':'wheel'}),accel=a); assert s.pga()==3; assert len(a.calc_vel().get_value())==3"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
